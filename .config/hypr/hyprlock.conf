background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    contrast = 1.0
    brightness = 0.5
    vibrancy = 0.2
}

general {
    grace = 2
    hide_cursor = true
    no_fade_in = false
    disable_loading_bar = true
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    font_family = JetBrainsMono
    font_size = 110
    color = rgba(255,255,255,0.95)
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.5)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    font_family = JetBrainsMono
    font_size = 18
    color = rgba(255,255,255,0.75)
    position = 0, 130
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    font_family = JetBrainsMono
    font_size = 14
    color = rgba(255,255,255,0.5)
    position = 0, -70
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 48
    position = 0, -130
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgba(15, 15, 20, 0.55)
    outer_color = rgba(255, 255, 255, 0.20)
    check_color = rgba(165, 215, 165, 0.8)
    fail_color = rgba(220, 100, 100, 0.85)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    font_family = JetBrainsMono
    placeholder_text = <i>password</i>
    rounding = 12
}
